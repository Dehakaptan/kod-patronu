<style id="bootcss">
#boot{position:fixed;inset:0;z-index:100000;overflow:hidden;color:#fff;font-family:Nunito,ui-rounded,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;

#boot.out{opacity:0;pointer-events:none}
#boot.out .bt-center{transform:translateY(-10px) scale(1.03);transition:transform .8s cubic-bezier(.4,0,.2,1)}
#boot .bt-noise{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(rgba(255,255,255,.9) .6px,transparent .7px);background-size:3px 3px;mix-blend-mode:overlay;pointer-events:none}
#boot .bt-halo{position:absolute;left:50%;top:36%;width:min(760px,120vw);height:min(760px,120vw);transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(86,140,255,.32) 0%,rgba(86,140,255,.10) 35%,transparent 65%);animation:btHalo 6s ease-in-out infinite alternate}
@keyframes btHalo{to{transform:translate(-50%,-50%) scale(1.08);opacity:.85}}
#boot .bt-stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#dfe9ff;animation:btTw 3.4s ease-in-out infinite}
@keyframes btTw{50%{opacity:.12}}
#boot .bt-city{position:absolute;left:0;right:0;bottom:0;height:40vh;min-height:150px;opacity:0;transform:translateY(24px);animation:btUp 1.2s .15s cubic-bezier(.2,.8,.2,1) forwards}
#boot .bt-city svg{width:100%;height:100%;display:block}
#boot .bt-city .w{fill:#1b2f60;transition:fill .6s ease}
#boot .bt-city .w.on{fill:#ffd27a}
#boot .bt-city .w.on.c{fill:#a9e0ff}
#boot .bt-city .w.on.f{animation:btFl 4s ease-in-out infinite}
@keyframes btFl{50%{opacity:.55}}
#boot .bt-city .bk{animation:btBk 1.6s steps(1) infinite}
@keyframes btBk{50%{opacity:.1}}
#boot .bt-fade{position:absolute;left:0;right:0;bottom:0;height:45vh;background:linear-gradient(180deg,transparent 0%,rgba(5,13,34,.0) 40%,rgba(5,13,34,.55) 100%);pointer-events:none}
#boot .bt-center{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:min(440px,90vw)}
#boot .bt-logo{width:clamp(72px,13vmin,104px);height:auto;filter:drop-shadow(0 14px 28px rgba(10,30,90,.55)) drop-shadow(0 0 24px rgba(80,140,255,.35));
  opacity:0;transform:translateY(10px) scale(.9);animation:btIn .9s .1s cubic-bezier(.2,.8,.2,1) forwards}
#boot .bt-logo .by{animation:btBy 2.6s ease-in-out infinite}
#boot .bt-logo .by2{animation-delay:-.9s}#boot .bt-logo .by3{animation-delay:-1.7s}
@keyframes btBy{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-3px);opacity:.75}}
#boot .bt-logo .ant{animation:btBk 1.6s steps(1) infinite}
@keyframes btIn{to{opacity:1;transform:none}}
@keyframes btUp{to{opacity:1;transform:none}}
#boot .bt-title{margin:clamp(12px,2.6vmin,20px) 0 0;font-weight:900;font-size:clamp(28px,7vmin,50px);letter-spacing:.16em;line-height:1;white-space:nowrap;display:flex;gap:.06em}
#boot .bt-title span{display:inline-block;opacity:0;transform:translateY(12px);animation:btIn .8s cubic-bezier(.2,.8,.2,1) forwards}
#boot .bt-title span:first-child{animation-delay:.28s;background:linear-gradient(180deg,#fff 35%,#c4d6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .bt-title span:last-child{animation-delay:.4s;background:linear-gradient(180deg,#ffe7a3 15%,#ffb43b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .bt-tag{display:flex;align-items:center;gap:12px;margin-top:clamp(8px,1.8vmin,12px);font-weight:800;font-size:clamp(9.5px,1.75vmin,12px);letter-spacing:.42em;color:#93abdc;text-transform:uppercase;white-space:nowrap;opacity:0;animation:btIn .8s .55s forwards}
#boot .bt-tag::before,#boot .bt-tag::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(147,171,220,.7))}
#boot .bt-tag::after{transform:scaleX(-1)}
#boot .bt-load{width:min(300px,72vw);margin-top:clamp(22px,5vmin,40px);opacity:0;animation:btIn .8s .7s forwards}
#boot .bt-bar{position:relative;height:4px;border-radius:999px;background:rgba(255,255,255,.1);overflow:visible}
#boot .bt-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,#2f6bff,#62c8ff)}
#boot .bt-bar i::after{content:"";position:absolute;right:-4px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#e9f7ff;box-shadow:0 0 0 3px rgba(98,200,255,.25),0 0 16px 4px rgba(98,200,255,.75)}
#boot .bt-meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:#a8bce4}
#boot .bt-meta b{font-weight:900;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.04em;background:none;padding:0;border:0;box-shadow:none}
#boot .bt-tip{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(460px,88vw);display:flex;gap:12px;align-items:center;
  padding:11px 14px;border-radius:14px;background:rgba(10,24,60,.55);border:1px solid rgba(160,190,255,.16);box-shadow:0 10px 30px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  opacity:0;animation:btFade .8s .9s forwards}
@keyframes btFade{to{opacity:1}}
#boot .bt-tip em{flex:none;font-style:normal;font-weight:900;font-size:10px;letter-spacing:.18em;color:#0b1a3d;background:linear-gradient(180deg,#ffe29a,#ffb43b);padding:4px 7px;border-radius:6px}
#boot .bt-tip span{font-weight:700;font-size:12.5px;line-height:1.4;color:#d5e1f8;transition:opacity .35s}
#boot .bt-ver{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));font-size:10.5px;font-weight:800;letter-spacing:.14em;color:rgba(168,188,228,.45)}
@media (max-height:480px){
  #boot .bt-center{top:38%} #boot .bt-load{margin-top:16px} #boot .bt-city{height:34vh}
  #boot .bt-tip{bottom:10px;padding:8px 12px} #boot .bt-tip span{font-size:11.5px}
}
@media (max-width:440px){ #boot .bt-tag{letter-spacing:.26em;gap:8px} #boot .bt-tag::before,#boot .bt-tag::after{width:16px} }
@media (prefers-reduced-motion:reduce){ #boot *{animation-duration:.01s!important;animation-iteration-count:1!important} }
</style>

<script>
/* AÇILIŞ EKRANI: logo, katmanlı gece şehri (pencereler yüklendikçe yanar), ilerleme ve ipuçları */
(function(){
  var B = document.getElementById('boot'); if (!B) return;
  var NS = 'http://www.w3.org/2000/svg', svg = B.querySelector('.bt-city svg');
  var seed = 7; function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function el(tag, attrs, parent){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; }
  var wins = [];
  // üç derinlik katmanı: arkadakiler daha açık ve sisli, öndekiler koyu ve pencereli
  var layers = [
    {col:'#15306b', minH:120, maxH:300, minW:60, maxW:120, gap:6, win:false},
    {col:'#0f2558', minH:90, maxH:250, minW:70, maxW:140, gap:10, win:true, wcol:'#17305f'},
    {col:'#0a1b44', minH:60, maxH:190, minW:80, maxW:170, gap:14, win:true, wcol:'#132a57'}
  ];
  var crane = false;
  layers.forEach(function(L, li){
    var g = el('g', {}), x = -40;
    while (x < 1640){
      var w = L.minW + rnd()*(L.maxW - L.minW), h = L.minH + rnd()*(L.maxH - L.minH);
      if (li === 1 && x > 700 && x < 900) h = 330;                 // ortada uzun kule
      var y = 420 - h;
      el('rect', {x:x.toFixed(0), y:y.toFixed(0), width:w.toFixed(0), height:h.toFixed(0), fill:L.col}, g);
      if (rnd() < 0.35) el('rect', {x:(x + w*0.3).toFixed(0), y:(y - 10).toFixed(0), width:(w*0.4).toFixed(0), height:10, fill:L.col}, g);   // çatı katı
      if (h > 260){ el('rect', {x:(x + w/2 - 1.5).toFixed(0), y:(y - 34).toFixed(0), width:3, height:34, fill:L.col}, g); el('circle', {cx:(x + w/2).toFixed(0), cy:(y - 36).toFixed(0), r:3.2, fill:'#ff5d5d', 'class':'bk'}, g); }
      if (li === 1 && !crane && x > 1050 && h < 220){ crane = true;    // inşaat vinci: büyüme
        var cx = x + w*0.6, top = y - 80; el('rect', {x:cx.toFixed(0), y:top.toFixed(0), width:4, height:80, fill:L.col}, g);
        el('rect', {x:(cx - 70).toFixed(0), y:top.toFixed(0), width:110, height:4, fill:L.col}, g);
        el('rect', {x:(cx - 62).toFixed(0), y:(top + 4).toFixed(0), width:1.5, height:36, fill:L.col}, g); }
      if (L.win){
        var cols = Math.max(2, Math.floor((w - 16) / 16)), rows = Math.floor((h - 24) / 22), cw = (w - 16) / cols;
        for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++){
          if (rnd() < 0.18) continue;
          var wr = el('rect', {x:(x + 8 + c*cw + 2).toFixed(1), y:(y + 14 + r*22).toFixed(1), width:(cw - 6).toFixed(1), height:9, rx:1.2, fill:L.wcol, 'class':'w' + (rnd() < 0.22 ? ' c' : '') + (rnd() < 0.15 ? ' f' : '')}, g);
          wr.style.animationDelay = (-rnd()*4).toFixed(2) + 's'; wins.push(wr);
        }
      }
      x += w + L.gap * (0.4 + rnd());
    }
  });
  // yıldızlar
  var st = B.querySelector('.bt-stars');
  for (var s = 0; s < 46; s++){ var i0 = document.createElement('i'); i0.style.left = (Math.random()*100).toFixed(2) + '%'; i0.style.top = (Math.random()*52).toFixed(2) + '%'; i0.style.opacity = (0.25 + Math.random()*0.6).toFixed(2); i0.style.animationDelay = (-Math.random()*3.4).toFixed(2) + 's'; if (Math.random() < 0.2){ i0.style.width = i0.style.height = '3px'; } st.appendChild(i0); }
  // pencereler aşağıdan yukarı ve rastgele bir sırayla yanar
  wins.sort(function(a, b){ return (+b.getAttribute('y') + Math.random()*120) - (+a.getAttribute('y') + Math.random()*120); });
  var bar = B.querySelector('.bt-bar i'), pc = B.querySelector('.bt-pc'), stx = B.querySelector('.bt-st'), tip = B.querySelector('.bt-tip span');
  var MSG = ['Ofis kapısı açılıyor', 'Bilgisayarlar açılıyor', 'Kahve demleniyor', 'Ekip masalarına oturuyor', 'Projeler hazırlanıyor', 'Son rötuşlar', 'Hazır'];
  var TIPS = ['Mutlu ekip daha hızlı çalışır. Yorulan ekibini tatile göndermeyi unutma.',
    'Kendi karakterine dokun: toplantı yapıp şirketin geleceğine karar ver.',
    'Her ürün türünde kullanıcılar farklı şeyleri önemser. İlk ürününü bitirince öğrenirsin.',
    'Trend olan konuda ürün çıkarırsan çok daha fazla kullanıcı gelir.',
    'Eski bilgisayarlar ekibi yavaşlatır. Ekipmanlarını zamanında yenile.',
    'Kredi taksitlerini zamanında öde; kredi puanın yükselir, faizler düşer.',
    'Ar-Ge puanlarıyla Teknoloji sayfasında kalıcı yenilikler geliştir.',
    'Gökdelende bir yönetici tut; e-postalar, eğitimler ve yeni işlerle o ilgilensin.'];
  var ti = Math.floor(Math.random()*TIPS.length); tip.textContent = TIPS[ti];
  var tipT = setInterval(function(){ tip.style.opacity = 0; setTimeout(function(){ ti = (ti + 1) % TIPS.length; tip.textContent = TIPS[ti]; tip.style.opacity = 1; }, 350); }, 3400);
  var p = 0, target = 16, t0 = Date.now(), done = false, lit = 0;
  window.bootStage = function(v){ if (v > target) target = v; };
  function draw(){
    p += Math.max(0.1, (target - p) * 0.045); if (p > target) p = target;
    bar.style.width = p.toFixed(1) + '%'; pc.textContent = Math.floor(p) + '%';
    stx.textContent = MSG[Math.min(MSG.length - 1, Math.floor(p / 100 * (MSG.length - 1) + 0.0001))];
    var want = Math.floor(wins.length * Math.min(1, p / 92));
    while (lit < want){ wins[lit].classList.add('on'); lit++; }
    if (p >= 100 && !done){ done = true; clearInterval(tipT); setTimeout(function(){ B.classList.add('out'); setTimeout(function(){ if (B.parentNode) B.parentNode.removeChild(B); }, 850); }, 420); return; }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  document.addEventListener('DOMContentLoaded', function(){ window.bootStage(45); });
  window.addEventListener('load', function(){ window.bootStage(72); });
  var poll = setInterval(function(){
    var e2 = Date.now() - t0, ok3 = window.S3D && window.S3D.ok;
    if (ok3) window.bootStage(92);
    if (document.readyState === 'complete' && (ok3 || e2 > 5000) && e2 > 2600){ clearInterval(poll); window.bootStage(100); }
  }, 120);
})();
</script>

  const neg = n<0; n = Math.abs(n); let s;
  if (n < 10000) s = Math.round(n).toLocaleString('tr-TR');
  else if (n < 1e6) s = (n/1e3).toLocaleString('tr-TR',{maximumFractionDigits:1})+' B';

}

const SKILLS = [

  {k:'kod',  ad:'Yazılım bilgisi', acik:'Kod yazma ustalığı, daha az hata'},

const ROLE_MAIN = {prog:'kod', tas:'tas', test:'test'};
function genSkills(role, skill, seed){
  let r = (seed||1)*9301 + 49297; const rnd = () => (r = (r*9301 + 49297) % 233280) / 233280;
  const sk = {}, main = ROLE_MAIN[role];
  for (const s of SKILLS){
    let v = s.k===main ? skill + (rnd()*2-1) : s.k==='hiz' || s.k==='uyum' ? skill*0.75 + rnd()*4 - 1.5 : skill*0.5 + rnd()*3 - 1;
    sk[s.k] = clamp(Math.round(v), 1, 10);
  }
  return sk;
}
const skillsOf = e => e.sk || (e.sk = genSkills(e.role, e.skill, typeof e.id==='number' ? e.id : 7));
const skMain = e => skillsOf(e)[ROLE_MAIN[e.role]] || e.skill;
function skillUp(e){ const sk = skillsOf(e), m = ROLE_MAIN[e.role]; sk[m] = Math.min(10, sk[m]+1); const o = pick(SKILLS.filter(s => s.k!==m && sk[s.k] < 10)); if (o && Math.random() < 0.6) sk[o.k]++; }

let actx = null;
function snd(type){
  if (!S || !S.sound) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const N = {
      tap:   [[1200,0.025,'square',0.02,0],[700,0.02,'square',0.016,0.01]],
      click: [[660,0.04,'sine',0.06,0]],
      cash:  [[1318,0.09,'sine',0.12,0],[1760,0.16,'sine',0.12,0.07]],
      ok:    [[523,0.1,'triangle',0.14,0],[659,0.1,'triangle',0.14,0.09],[784,0.1,'triangle',0.14,0.18],[1046,0.22,'triangle',0.14,0.27]],

      pop:   [[900,0.05,'sine',0.04,0],[1300,0.05,'sine',0.03,0.03]],
    }[type];
    const t0 = actx.currentTime;
    for (const [f,d,w,v,dl] of N){

      o.type = w; o.frequency.value = f;
      g.gain.setValueAtTime(v, t0+dl); g.gain.exponentialRampToValueAtTime(0.0001, t0+dl+d);
      o.connect(g); g.connect(actx.destination); o.start(t0+dl); o.stop(t0+dl+d+0.02);
    }

}

function give(p, part, amt, skill, bm=1){
  const room = Math.min(p[part+'Req'] - p[part], sprRoom(p));
  const want = amt*sprSpeed(p); p._want = (p._want||0) + want;      // herkes çalışır, iş oranlı paylaşılır
  const a = Math.min(want*(p._k ?? 1), room);
  if (a <= 0) return 0;
  p[part] += a; p.pts += a; p.skillPts += a*skill;
  p.bugs += a * bugRate(skill) * FOCUS[p.focus].bug * bm * (p.bugMul||1);
  return a;
}
function fixBugs(p, amt){ const b = p.bugs; p.bugs = Math.max(0, p.bugs - amt); return b - p.bugs; }
function workOn(p, part, amt, skill, bm=1){
  const other = part==='kod' ? 'tas' : 'kod';
  if (p[part] < p[part+'Req']) return ['w', give(p, part, amt, skill, bm)];
  if (p[other] < p[other+'Req']) return ['w', give(p, other, amt*0.3, skill, bm)];
  return ['b', fixBugs(p, amt*0.1)];
}
function lowerPart(p){ return p.kod/p.kodReq <= p.tas/p.tasReq ? 'kod' : 'tas'; }
const hasInv = id => !!(S.innov && S.innov[id] && S.innov[id].done);
const isAway = e => !!(e.task && AWAY.includes(e.task.type));
const leadBonus = e => S.emps.some(x => x!==e && x.lead && x.role===e.role && !isAway(x)) ? 1.1 : 1;
const canResearch = i => !hasInv(i.id) && (!i.req || S.tech[i.req]);
function researchTick(e, sp, dt){
  const inv = INNOV.find(i=>i.id===e.task.innov);
  if (!inv || hasInv(inv.id)){ e.task = null; sceneKey = ''; return; }
  const st = S.innov[inv.id] = S.innov[inv.id] || {pts:0};
  const v = (e.skill + skillsOf(e).arge)/2*0.5*sp*moodMult(e)*(0.85 + skillsOf(e).hiz*0.03)*dt;
  st.pts += v; fxAdd(e.id, 'arge', v);
  if (st.pts >= inv.puan){
    st.done = true; st.pts = inv.puan;
    for (const x of S.emps) if (x.task && x.task.type==='arge' && x.task.innov===inv.id) x.task = null;
    sceneKey = '';
    toast(`🔬 Yenilik tamamlandı: ${inv.ikon} ${inv.ad}!`); snd('ok');
    setTimeout(()=>speakAll('🎉'), 300);
  }
}

function workTick(dt){
  if (S.meeting) return;          // toplantıda iş durur
  for (const e of S.emps) if (e.task && e.task.type==='arge') researchTick(e, teamSpeed(), dt);
  const need = S.projs.filter(p => needsWork(p) && !sprWait(p));
  if (!need.length) return;
  const n = need.length, sp = teamSpeed(), fs = founderSkill();
  const solo = 1 + 2/(1 + S.emps.filter(e => !isAway(e)).length*0.8);   // tek başınayken x3, ekip büyüdükçe azalır
  const fa = 0.8*fs*sp*solo*dt/n * cyBossMult();      // kurucu kendi kendine çalışır
  let fk = 0, ft = 0;
  for (const p of need){
    if (S.ftask) continue;
    if (!devDone(p)){ const part = lowerPart(p), a = give(p, part, fa*knowMult(S.fknow, p.type, 'me'), fs, knowBug(S.fknow)); if (part==='kod') fk += a; else ft += a; addC(p, 'me', part, a); } else addC(p, 'me', 'fix', fixBugs(p, fa*0.3*knowFix(S.fknow,'me')));
  }
  if (fk+ft > 0){ fxAdd('me', fk>=ft?'prog':'tas', fk+ft); S.rp = (S.rp||0) + (fk+ft)*0.04; }
  for (const e of S.emps){
    if (e.task && e.task.type!=='mentor') continue;
    const m = moodMult(e) * leadBonus(e) * (e.task ? 0.8 : 1) * ((e.fresh||0) > 0 ? 1.15 : 1) * (0.85 + skillsOf(e).hiz*0.03) * (e.ceza && S.day < e.ceza.until ? 1.35 : 1);   /* ek mesai cezası */
    const ms = (e.skill + skMain(e))/2;
    let w = 0, b = 0;
    for (const p of need){
      const spec = (e.spec===p.type ? 1.35 : 1) * knowMult(e.know, p.type, e.role), bm = knowBug(e.know);
      if (e.role==='test'){ const x = fixBugs(p, ms*0.15*testMult()*sp*m*spec*knowFix(e.know, e.role)*dt/n); b += x; addC(p, e.id, 'fix', x); }
      else { const [k,v] = workOn(p, e.role==='prog'?'kod':'tas', ms*0.6*sp*m*spec*dt/n, skMain(e), bm); if (k==='w'){ w += v; addC(p, e.id, e.role==='prog'?'kod':'tas', v); } else { b += v; addC(p, e.id, 'fix', v); } }
    }
    if (w > 0){ fxAdd(e.id, e.role, w); S.rp = (S.rp||0) + w*0.04; }
    if (b > 0) fxAdd(e.id, 'fix', b*6);
  }
  paceCap(need, dt);
}

function prodDay(pr){
  pr.age++;

  if (pr.viral > 0) pr.viral--;

  const rev = pr.users * TYPES[pr.type].arpu * revMult() * (pr.pcut && S.day < pr.pcut ? 0.8 : 1) * cyWorldRev(pr);
  pr.earned += rev;
  if (pr.age > 8+pl && f < 0.03){ pr.active = false; pr.users = 0; toast(`📴 ${esc(pr.name)} kapandı. Yeni ürün zamanı!`); }
  return rev;
}

}

    if (S.os && S.os.adBoost){ S.os.adBoost = false; pr.peak = Math.round(pr.peak*1.15); }

  downX = e.clientX; downY = e.clientY; skipUp = false; emptyTap = false;
  downSig = actSig(e.target.closest('[data-act]'));
  // 3D sahne: dokunulan yer karakter mi, oda mı, boşluk mu?
  if (window.S3D && S3D.ok && e.target.classList && e.target.classList.contains('scene3d') && S && !paused){
    e.preventDefault();
    const h = S3D.pick(e);
    if (h.cid){ skipUp = true; S.seenEmp = true; snd('click'); if (h.cid === 'me') founderMenu(); else if (h.cid === 'mgr') mgrMenu(); else empMenu(+h.cid); return; }
    panStart(e);
    if (h.empty) emptyTap = true;     // boşluk: ekip aktivitesi menüsü (odaya dokunmak artık iş yapmaz)
    return;
  }
  const ch = e.target.closest('#scene .ch');
  if (ch && S && !paused){ e.preventDefault(); skipUp = true; S.seenEmp = true; snd('click'); if (ch.dataset.cid === 'me') founderMenu(); else empMenu(+ch.dataset.cid); return; }
  const t = e.target.closest('.tapper');
  if (t && S && !paused){
    e.preventDefault();
    if (t.id === 'scene'){ panStart(e); if (e.target === t || e.target.tagName === 'svg') emptyTap = true; } // ofisin dışındaki boşluk
  }
});
document.addEventListener('pointermove', e => panMove(e));
document.addEventListener('pointercancel', panEnd);
document.addEventListener('pointerup', e => {
  panEnd();
  if (emptyTap){ emptyTap = false; return; }   /* boşluk artık bir şey açmaz; aktiviteler Personel sayfasında */
  if (skipUp){ skipUp = false; return; }
  if (Math.hypot(e.clientX-downX, e.clientY-downY) > 12) return;
  const el = e.target.closest('[data-act]');
  // sadece basılan butonun üstünde bırakılınca çalışsın (menü açılırken alttaki butona sızmasın)
  if (!el || actSig(el) !== downSig) return;
  if (!el || el.disabled) return;
  if (!S && !['begin','intro'].includes(el.dataset.act) && !el.dataset.act.startsWith('su-')) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (!['choice','daily','begin'].includes(el.dataset.act)) snd('click');
  fn(el);
  updateAll(true);
});

function newProdHTML(){
  if (!S.trend) rollTrend();
  const T = TYPES[form.type], m = SIZES[form.size].m*FOCUS[form.focus].work;
  const work = Math.round((T.kod+T.tas)*m);
  const chip = (act, k, on, label, extra='') => `<button class="chip ${on?'on':''} ${extra}" data-act="${act}" data-v="${k}">${label}</button>`;
  const typeChips = Object.entries(TYPES).map(([k,t]) => chip('f-type', k, form.type===k, `${S.tech[k]?'':LOCK_SVG}${t.ad}`, S.tech[k]?'':'lock')).join('');

  const topicChips = Object.entries(TOPICS).filter(([k,t]) => t.g===curG).map(([k,t]) => {
    const kn = (S.known||{})[form.type+':'+k];
    return chip('f-topic', k, form.topic===k, `${t.ad}${k===S.trend?' <i class="ttag">TREND</i>':''}${kn!==undefined?` <b class="kst">${fitStars(kn)}</b>`:''}`);
  }).join('');

let toastQ = [], lastTap = 0;
document.addEventListener('pointerdown', () => { lastTap = performance.now(); }, true);
const uiBusy = () => !!page || !$('modal').classList.contains('hidden');
function flushToasts(){
  if (uiBusy()) return;
  const q = toastQ.slice(-6); toastQ = []; q.forEach((h, k) => setTimeout(() => { if (!uiBusy()) showToast(h); else toastQ.push(h); }, 350 + k*1300));
  /* sayfa açıkken gelen acil izin mesajı ofise dönünce açılır */
  const am = S && (S.inbox||[]).find(m => m.tpl==='acil' && !m.read && mailNeedsReply(m));
  if (am) setTimeout(() => { if (!uiBusy() && mailNeedsReply(am)) openNoteModal(am); }, 600);
}
function toast(html){
  /* bir sayfa açıkken yalnızca oyuncunun kendi tıklamasına verilen cevaplar görünür */
  if (uiBusy() && performance.now() - lastTap > 400){ toastQ.push(html); if (toastQ.length > 12) toastQ.shift(); return; }
  showToast(html);
}
function showToast(html){
  const t = document.createElement('div'); t.className='toast'; t.innerHTML = html;
  const box = $('toasts'); box.appendChild(t);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(()=>t.remove(), 4700);
}

  document.body.appendChild(f); setTimeout(()=>f.remove(), 950);
}

function save(){

function migrate(d){
  const s = Object.assign(newState(d.name), d);
  s.stats = Object.assign(newState('').stats, d.stats||{});
  if (s.v === 1){ s.projs = d.proj ? [d.proj] : []; delete s.proj; s.v = 2; }
  if (s.v === 2){ s.office = ({0:(s.emps.length?1:0),1:2,2:3,3:3,4:4})[s.office] ?? 0; s.v = 3; }
  if (!d.holders && (s.ownership ?? 100) < 100) s.holders = [{id:999999, ad:'Erken Yatırımcılar', renk:'#64748b', pct:100 - s.ownership, paid:0, day:1}];
  if (!d.eq){ const u = d.upg||{}; s.eq = {pc: u.ekran ? 2 : 0, klavye: Math.min(4, Math.ceil((u.klavye||0)/2.5)), koltuk: u.sandalye ? 2 : 0}; s.eqStd = Math.min(4, Math.floor(((s.day||1)-1)/300)); }
  if (!s.offered) s.offered = {};
  if (!Array.isArray(s.projs)) s.projs = [];
  for (const e of s.emps) if (e.mood === undefined) e.mood = 70;
  if (!s.innov) s.innov = {};
  return s;
}
function load(){
  for (const key of [SAVE_KEY, BACKUP_KEY]){
    try {
      const d = JSON.parse(localStorage.getItem(key));
      if (d && (d.v>=1 && d.v<=3) && d.name){ S = migrate(d); return true; }
    } catch(e){}
  }
  return false;
}

/* ================= ÖLÇEKLEME: her telefonda aynı oranlar ================= */
function fit(){
  const app = $('app'), probe = $('probe');
  // iPhone ana ekran uygulamasında ölçüler gecikmeli gelebilir: en büyük güvenilir ölçüyü kullan
  const vv = window.visualViewport, de = document.documentElement;
  const vw = Math.max(window.innerWidth, de.clientWidth || 0, vv ? Math.round(vv.width) : 0), vh = Math.max(window.innerHeight, de.clientHeight || 0, vv ? Math.round(vv.height) : 0);
  const portrait = vh > vw;
  const W = portrait ? vh : vw, H = portrait ? vw : vh;
  const z = clamp(Math.min(H/390, W/800), 0.72, 2.2);
  const cs = getComputedStyle(probe);
  const it = parseFloat(cs.paddingTop)||0, ir = parseFloat(cs.paddingRight)||0, ib = parseFloat(cs.paddingBottom)||0, il = parseFloat(cs.paddingLeft)||0;
  // dik tutulduğunda oyun 90° döndürülür; çentik payları da yer değiştirir
  const [sl, sr, st, sb] = portrait ? [it, ib, ir, il] : [il, ir, it, ib];
  app.style.zoom = z;
  app.style.width = (W/z)+'px';
  app.style.height = (H/z)+'px';
  app.style.left = portrait ? (vw/z)+'px' : '0px';
  app.style.transform = portrait ? 'rotate(90deg)' : '';
  app.style.setProperty('--sl', (sl/z)+'px'); app.style.setProperty('--sr', (sr/z)+'px');
  app.style.setProperty('--st', (st/z)+'px'); app.style.setProperty('--sb', (sb/z)+'px');
  app.style.setProperty('--ah', (H/z)+'px');
}
window.addEventListener('resize', fit);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);

/* ================= EMOJİ TEMİZLEYİCİ =================
   Ekrana gelen tüm yazılardan emojiler silinir. Kendi çizdiğimiz simgeler (SVG) etkilenmez.
   (Kartlardaki simgeler önce artIcons ile çizime çevrilir, temizleyici ondan sonra çalışır.) */
const EMO_RE = /(?:[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}][\uFE0F\u200D\u20E3\u{1F3FB}-\u{1F3FF}]*)+[\uFE0F\u200D]*\s?/gu;
function stripEmoji(node){
  if (!node) return;
  if (node.nodeType === 3){
    const p = node.parentNode; if (!p || p.closest && p.closest('svg,script,style,textarea')) return;
    const v = node.nodeValue; if (!v || !EMO_RE.test(v)) return; EMO_RE.lastIndex = 0;
    const nv = v.replace(EMO_RE, ''); if (nv === v) return; if (!nv.trim()) node.remove(); else node.nodeValue = nv; return;
  }
  if (node.nodeType !== 1 || /^(SVG|SCRIPT|STYLE|TEXTAREA|CANVAS)$/i.test(node.nodeName)) return;
  const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT); const list = []; let n; while ((n = w.nextNode())) list.push(n);
  for (const x of list) stripEmoji(x);
}
new MutationObserver(ms => { for (const m of ms){ if (m.type === 'characterData') stripEmoji(m.target); else for (const a of m.addedNodes) stripEmoji(a); } })
  .observe(document.body, {subtree:true, childList:true, characterData:true});
stripEmoji(document.body);
