<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kod Patronu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Kod Patronu – Yazılım Şirketi Simülasyonu</title>
<style>
:root{--bg:#0b1626;--panel:#12223a;--panel2:#182c48;--line:rgba(255,255,255,.08);--gold:#f5b83d;--gold2:#ffd77a;--txt:#e8eef8;--mut:#8fa3bf;--green:#34d399;--red:#f87171;--orange:#fb923c;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;overscroll-behavior:none;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
#app{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#16294a 0%,var(--bg) 70%);overflow:hidden}
@media (orientation:portrait){
  #app{width:100vh;width:100dvh;height:100vw;left:100vw;transform:rotate(90deg);transform-origin:top left}
}
/* ---- üst bar ---- */
header{display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));background:rgba(0,0,0,.3);border-bottom:1px solid var(--line);flex-shrink:0}
.logo{font-weight:900;color:var(--gold);font-size:14px;line-height:1;letter-spacing:.5px;margin-right:4px}
.logo span{display:block;font-size:8px;color:var(--mut);letter-spacing:2px;font-weight:700}
.hb{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;font-family:inherit;position:relative}
.hb.glow{border-color:var(--gold);box-shadow:0 0 10px rgba(245,184,61,.6);animation:glow 1.2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 2px rgba(245,184,61,.2)}}
.spacer{flex:1}
.kasa{font-size:16px;font-weight:900;white-space:nowrap}
.kasa small{font-size:9px;color:var(--green);font-weight:800;letter-spacing:1px;margin-right:4px}
.kasa.neg b{color:var(--red)}
.day{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:11px;font-weight:700;white-space:nowrap}
/* ---- gövde ---- */
#body{flex:1;display:flex;gap:10px;padding:8px max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));min-height:0}
#left{width:46%;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
#right{flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.dcard{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.drow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cname{font-size:15px;font-weight:900}
.sub{font-size:11px;color:var(--mut);margin-top:1px}
.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}.blue{color:var(--blue)}
.val{text-align:right;font-size:10px;color:var(--mut)}
.val b{font-size:13px;color:var(--gold2)}
.kbox{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:5px 10px 6px;margin-top:6px}
.kbox>small{font-size:9px;color:var(--green);font-weight:800;letter-spacing:1px}
.bigmoney{font-size:22px;font-weight:900;line-height:1.1}
.bigmoney.neg{color:var(--red)}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:3px}
.k3 small{display:block;font-size:8.5px;color:var(--mut);font-weight:800;letter-spacing:.5px}
.k3 b{font-size:12px}
.strip{margin-top:6px;background:rgba(96,165,250,.1);border-left:3px solid var(--blue);border-radius:6px;padding:4px 8px;font-size:10.5px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex-shrink:0}
.tile{position:relative;border:none;border-radius:12px;padding:5px 2px 4px;color:#fff;font-family:inherit;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 0 rgba(0,0,0,.35)}
.tile:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 0 rgba(0,0,0,.35)}
.tile .ti{font-size:19px;line-height:1.1;display:block}
.tile b{display:block;font-size:11px;margin-top:1px}
.tile small{display:block;font-size:9px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.dot{position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.c-purple{background:linear-gradient(135deg,#8b5cf6,#5b21b6)}
.c-teal{background:linear-gradient(135deg,#14b8a6,#115e59)}
.c-orange{background:linear-gradient(135deg,#f97316,#9a3412)}
.c-blue{background:linear-gradient(135deg,#3b82f6,#1e40af)}
.c-pink{background:linear-gradient(135deg,#ec4899,#9d174d)}
.c-yellow{background:linear-gradient(135deg,#eab308,#854d0e)}
.c-green{background:linear-gradient(135deg,#22c55e,#166534)}
.c-red{background:linear-gradient(135deg,#ef4444,#991b1b)}
.cta2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctile{display:flex;align-items:center;gap:8px;border:none;border-radius:12px;padding:8px 10px;color:#fff;font-family:inherit;text-align:left;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 0 rgba(0,0,0,.35)}
.ctile:active{transform:translateY(2px)}
.ctile .ci{font-size:24px}
.ctile b{display:block;font-size:13px}
.ctile small{display:block;font-size:10px;opacity:.9}
.sechead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;margin-top:2px;padding:0 2px}
.prow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,#60a5fa);border-radius:10px;padding:6px 8px}
.prow.sel{background:var(--panel2);border-color:rgba(245,184,61,.5);border-left-color:var(--c)}
.prow .pi{font-size:20px}
.grow{flex:1;min-width:0}
.prow b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--c,#60a5fa);border-radius:2px}
.pill{font-size:9.5px;font-weight:900;padding:3px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;letter-spacing:.3px}
.pill.blue{color:var(--blue);background:rgba(96,165,250,.12)}.pill.orange{color:var(--orange);background:rgba(251,146,60,.12)}.pill.green{color:var(--green);background:rgba(52,211,153,.12)}.pill.red{color:var(--red);background:rgba(248,113,113,.12)}.pill.gold{color:var(--gold);background:rgba(245,184,61,.12)}
.prow.empty{border-style:dashed;border-left-width:1px;justify-content:center;color:var(--mut);font-size:11.5px;padding:9px}
.tapper{border:none;font-family:inherit;color:#1c1405;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:14px;font-weight:900;box-shadow:0 4px 0 #a16207;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tapper:active{transform:translateY(3px);box-shadow:0 1px 0 #a16207}
.tapper.bug{background:linear-gradient(90deg,#f97316,#fb7185);color:#fff;box-shadow:0 4px 0 #9a3412}
.tapper.idle{background:linear-gradient(90deg,#475569,#64748b);color:#e2e8f0;box-shadow:0 4px 0 #1e293b}
#tapBtn{width:100%;min-height:62px;margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:20px;flex-shrink:0}
#tapBtn small{display:block;font-size:10.5px;font-weight:700;opacity:.8;text-align:left}
#tapBtn .arrow{font-size:22px;background:rgba(0,0,0,.15);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
/* ---- sayfalar ---- */
#page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:40}
#page.hidden,#modal.hidden{display:none}
.phead{display:flex;align-items:center;gap:10px;padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));background:rgba(0,0,0,.3);border-bottom:1px solid var(--line);flex-shrink:0}
.back{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:6px 12px;font-weight:800;font-family:inherit;font-size:12px}
.ptitle{font-size:16px;font-weight:900;flex:1}
#pBody{flex:1;overflow-y:auto;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
h2{font-size:13px;margin:6px 2px 6px;color:var(--gold);text-transform:uppercase;letter-spacing:.8px}
h3{font-size:18px;margin-bottom:6px;text-align:center}
p{line-height:1.45}
.hint{font-size:11px;color:var(--mut);margin-top:6px}
.btn{background:#3b82f6;color:#fff;border:none;border-radius:10px;padding:8px 12px;font-weight:800;font-size:12.5px;font-family:inherit;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:#2a3a52;color:#6b7c95;box-shadow:none}
.btn.green{background:#16a34a}.btn.red{background:#dc2626}.btn.gray{background:#475569}.btn.orange{background:#ea580c}.btn.goldb{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1c1405}
.btn.sm{padding:6px 9px;font-size:11.5px}.btn.block{width:100%;margin-top:8px}
.row{display:flex;align-items:center;gap:8px}
.big{font-size:28px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#dde;border-radius:999px;padding:6px 10px;font-size:12px;font-family:inherit}
.chip.on{background:#3b82f6;border-color:#93c5fd;color:#fff;font-weight:800}
.chip.lock{opacity:.45}
.lbl{display:flex;justify-content:space-between;font-size:12px;margin:6px 0 3px}
.bar{height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px}
.skill{display:inline-block;height:5px;width:56px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;vertical-align:middle}
.skill>i{display:block;height:100%;background:linear-gradient(90deg,#facc15,#34d399)}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10.5px;font-weight:800}
.q1{background:#7f1d1d}.q2{background:#92400e}.q3{background:#3f6212}.q4{background:#15803d}.q5{background:linear-gradient(90deg,#a16207,#eab308);color:#111}
input[type=text]{width:100%;padding:8px 10px;border-radius:10px;border:1px solid #3b82f6;background:#08101d;color:#fff;font-size:16px;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kv{background:rgba(0,0,0,.22);border-radius:10px;padding:7px}
.kv b{display:block;font-size:14px}
.kv span{font-size:10px;color:var(--mut)}
.empty-msg{text-align:center;color:var(--mut);padding:18px 8px;font-size:13px}
.office{border-radius:14px;padding:10px;border:1px solid var(--line);margin-bottom:8px}
.office.l0{background:linear-gradient(160deg,#57534e,#292524)}
.office.l1{background:linear-gradient(160deg,#0e7490,#164e63)}
.office.l2{background:linear-gradient(160deg,#4338ca,#1e1b4b)}
.office.l3{background:linear-gradient(160deg,#7e22ce,#3b0764)}
.office.l4{background:linear-gradient(160deg,#0f172a,#1e3a8a 60%,#b45309)}
.otitle{display:flex;justify-content:space-between;font-weight:900;margin-bottom:8px;font-size:15px}
.otitle span{font-weight:600;font-size:11px;opacity:.85}
.desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:5px}
.desk{background:rgba(0,0,0,.28);border-radius:9px;text-align:center;padding:5px 2px 3px}
.desk .e{font-size:24px;display:block;line-height:1.15}
.desk .n{font-size:9.5px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.desk.empty .e{opacity:.3}
.busy .desk:not(.empty) .e{animation:bob .5s infinite alternate}
.busy .desk:nth-child(2n) .e{animation-delay:.2s}
@keyframes bob{to{transform:translateY(-4px)}}
.rank{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:5px}
.rank.me{border-color:var(--gold);background:rgba(245,184,61,.12)}
.rank .no{width:30px;text-align:center;font-weight:900;font-size:15px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.days7 div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 0;text-align:center;font-size:10px}
.days7 div.got{background:rgba(52,211,153,.15);border-color:var(--green)}
.days7 div.now{background:rgba(245,184,61,.2);border-color:var(--gold)}
.days7 b{display:block;font-size:16px}
.toggle{width:46px;height:26px;border-radius:13px;background:#475569;position:relative;border:none}
.toggle.on{background:#16a34a}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on::after{left:23px}
/* ---- modal / bildirim ---- */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.mbox{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--gold);border-radius:16px;padding:14px 16px;max-width:440px;width:100%;max-height:94%;overflow-y:auto;animation:pop .2s ease-out}
.mbox .ev{font-size:40px;text-align:center}
.mbox p{margin-bottom:6px;font-size:13px}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#toasts{position:absolute;top:46px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:90}
.toast{background:rgba(11,22,38,.96);border:1px solid var(--gold);padding:6px 12px;border-radius:10px;font-size:12px;max-width:80%;animation:tin .2s ease-out,tout .4s 2.4s forwards;box-shadow:0 4px 14px rgba(0,0,0,.5)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
@keyframes tout{to{opacity:0}}
.float{position:fixed;pointer-events:none;font-weight:900;font-size:17px;color:#fde68a;text-shadow:0 2px 4px #000;animation:fl .9s ease-out forwards;z-index:200;transform:translate(-50%,0)}
@keyframes fl{to{margin-top:-60px;opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">KOD PATRONU<span>YAZILIM ŞİRKETİ</span></div>
    <button class="hb" id="dailyBtn" data-act="daily">🎁 Günlük</button>
    <button class="hb" data-act="page" data-v="sirala">🏆 Sıralama</button>
    <button class="hb" data-act="page" data-v="ayarlar">⚙️</button>
    <div class="spacer"></div>
    <div class="kasa" id="hKasa"><small>KASA</small><b id="hMoney">₺0</b></div>
    <div class="day" id="hDate">📅</div>
  </header>
  <div id="body">
    <section id="left">
      <div id="dash"></div>
      <div id="tiles" class="tiles"></div>
    </section>
    <section id="right">
      <div class="cta2">
        <button class="ctile c-blue" data-act="page" data-v="isler"><span class="ci">👔</span><div><b>Müşteri İşleri</b><small id="offCount"></small></div></button>
        <button class="ctile c-green" data-act="page" data-v="yeni"><span class="ci">🛠️</span><div><b>Yeni Ürün</b><small>Kendi ürününü çıkar</small></div></button>
      </div>
      <div class="sechead"><span>Devam eden projeler</span><span class="gold" id="slotInfo"></span></div>
      <div id="projList" style="display:flex;flex-direction:column;gap:5px"></div>
      <button id="tapBtn" class="tapper"></button>
    </section>
  </div>
  <div id="page" class="hidden">
    <div class="phead"><button class="back" data-act="home">‹ Ana ekran</button><div class="ptitle" id="pTitle"></div><div class="kasa"><small>KASA</small><b id="pMoney"></b></div></div>
    <div id="pBody"><div id="pInner"></div></div>
  </div>
  <div id="modal" class="hidden"></div>
  <div id="toasts"></div>
</div>

<script>
'use strict';
/* ================= SABİTLER ================= */
const SAVE_KEY = 'kodPatronu_v1';
const BACKUP_KEY = 'kodPatronu_yedek';
const DAY_SEC = 3;
const MONTH_DAYS = 30;
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const WEEKDAYS = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];

const TYPES = {
  web:   {ad:'Web Sitesi',     ikon:'🌐', kod:60,  tas:30,  users:3000,  arpu:0.10, fiyat:0,      rep:0,   tier:1},
  mobil: {ad:'Mobil Uygulama', ikon:'📱', kod:120, tas:80,  users:6000,  arpu:0.12, fiyat:15000,  rep:10,  tier:1.5},
  oyun:  {ad:'Oyun',           ikon:'🎮', kod:220, tas:200, users:12000, arpu:0.14, fiyat:60000,  rep:35,  tier:2},
  ai:    {ad:'Yapay Zekâ',     ikon:'🤖', kod:550, tas:150, users:25000, arpu:0.25, fiyat:400000, rep:100, tier:3},
};
const SIZES = {kucuk:{ad:'Küçük',m:1,rep:0}, orta:{ad:'Orta',m:3,rep:12}, buyuk:{ad:'Büyük',m:8,rep:45}};
const FOCUS = {
  hizli:   {ad:'⚡ Hızlı',   work:0.7, bug:1.5, q:-5, acik:'Çabuk biter ama hata çok olur'},
  dengeli: {ad:'⚖️ Dengeli', work:1,   bug:1,   q:0,  acik:'Normal hız, normal kalite'},
  kaliteli:{ad:'💎 Kaliteli', work:1.4, bug:0.6, q:6,  acik:'Uzun sürer ama daha kaliteli'},
};
const OFFICES = [
  {ad:'Garaj',       ikon:'🏚️', kap:2,  slot:1, fiyat:0,       kira:0},
  {ad:'Küçük Ofis',  ikon:'🏠', kap:5,  slot:2, fiyat:25000,   kira:1500},
  {ad:'Plaza Katı',  ikon:'🏢', kap:10, slot:3, fiyat:150000,  kira:6000},
  {ad:'Kendi Binan', ikon:'🏬', kap:20, slot:4, fiyat:1000000, kira:20000},
  {ad:'Gökdelen',    ikon:'🌆', kap:40, slot:5, fiyat:8000000, kira:80000},
];
const ROLES = {
  prog:{ad:'Programcı', emo:['👨‍💻','👩‍💻'], acik:'Kod yazar'},
  tas: {ad:'Tasarımcı', emo:['👨‍🎨','👩‍🎨'], acik:'Tasarım yapar'},
  test:{ad:'Testçi',    emo:['🕵️‍♂️','🕵️‍♀️'], acik:'Hata düzeltir'},
};
const UPGRADES = [
  {id:'klavye',   ikon:'⌨️', ad:'Mekanik Klavye',       acik:'Her dokunuşun +1 daha fazla iş üretir', max:10, fiyat:l=>Math.round(400*Math.pow(2.2,l)/10)*10},
  {id:'kurs',     ikon:'📚', ad:'Kendini Geliştir',     acik:'Kurucu yeteneğin +1', max:7, fiyat:l=>Math.round(2000*Math.pow(2.5,l)/10)*10},

  const total = p.kodReq + p.tasReq;
  const q = 25 + avg*6.5 + FOCUS[p.focus].q + (S.upg.arge?8:0) - (p.bugs/total)*200;
  return Math.round(clamp(q,1,100));

function bizMult(l){ return (l>=10?2:1)*(l>=25?2:1)*(l>=50?2:1)*(l>=100?2:1); }
function seasonMult(){ const m = monthIdx(); return (m>=5&&m<=7) ? 2.5 : (m===11||m<=1) ? 0.3 : 1; }
function bizIncome(b, l){ if (!l) return 0; let v = b.gelir*l*bizMult(l); if (b.mevsim) v *= seasonMult(); return v; }
function bizCost(b, l){ return l===0 ? b.fiyat : Math.round(b.fiyat*0.3*Math.pow(1.13,l-1)/10)*10; }
function bizBulk(b, l, mul){
  let n = 0, cost = 0, money = S.money;
  const want = mul==='max' ? BIZ_MAX : mul;
  while (n < want && l+n < BIZ_MAX){
    const c = bizCost(b, l+n);
    if (mul==='max' && cost + c > money) break;
    cost += c; n++;
  }
  return {n, cost};
}
function bizSpent(b){ let c = 0; const l = S.biz[b.id]||0; for (let i=0;i<l;i++) c += bizCost(b,i); return c; }
function valuation(){
  let v = Math.max(0, S.money - debt());

  for (const b of BIZ) v += bizSpent(b)*0.8;
  v += OFFICES[S.office].fiyat*0.6;
  for (const k in S.tech) v += TYPES[k].fiyat*0.5;
  v += S.rep*2000 + S.emps.length*5000;
  return Math.round(v);
}

function snd(type){
  if (!S || !S.sound) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const N = {
      tap:   [[1200,0.025,'square',0.025,0],[700,0.02,'square',0.02,0.01]],
      click: [[520,0.03,'sine',0.05,0]],
      cash:  [[1318,0.09,'sine',0.12,0],[1760,0.16,'sine',0.12,0.07]],
      ok:    [[523,0.1,'triangle',0.14,0],[659,0.1,'triangle',0.14,0.09],[784,0.1,'triangle',0.14,0.18],[1046,0.22,'triangle',0.14,0.27]],
      bad:   [[220,0.22,'sawtooth',0.06,0],[165,0.25,'sawtooth',0.06,0.12]],
      event: [[880,0.08,'sine',0.1,0],[660,0.08,'sine',0.1,0.1],[990,0.15,'sine',0.1,0.2]],
    }[type];
    const t0 = actx.currentTime;
    for (const [f,d,w,v,dl] of N){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = w; o.frequency.value = f;
      g.gain.setValueAtTime(v, t0+dl); g.gain.exponentialRampToValueAtTime(0.0001, t0+dl+d);
      o.connect(g); g.connect(actx.destination); o.start(t0+dl); o.stop(t0+dl+d+0.02);
    }
  } catch(e){}
}

/* ================= ÇALIŞMA ================= */
function give(p, part, amt, skill){
  const room = p[part+'Req'] - p[part];
  const a = Math.min(amt, room);
  if (a <= 0) return 0;
  p[part] += a; p.pts += a; p.skillPts += a*skill;
  p.bugs += a * bugRate(skill) * FOCUS[p.focus].bug;
  return a;
}
function fixBugs(p, amt){ p.bugs = Math.max(0, p.bugs - amt); }
function workOn(p, part, amt, skill){
  const other = part==='kod' ? 'tas' : 'kod';
  if (p[part] < p[part+'Req']) give(p, part, amt, skill);
  else if (p[other] < p[other+'Req']) give(p, other, amt*0.3, skill);
  else fixBugs(p, amt*0.1);
}
function lowerPart(p){ return p.kod/p.kodReq <= p.tas/p.tasReq ? 'kod' : 'tas'; }
function workTick(dt){
  const need = S.projs.filter(needsWork);
  if (!need.length) return;
  const n = need.length, sp = teamSpeed(), fs = founderSkill();
  const fa = 0.25*fs*sp*dt/n;
  for (const p of need){
    if (!devDone(p)) give(p, lowerPart(p), fa, fs); else fixBugs(p, fa*0.15);
  }
  for (const e of S.emps){
    const amt = e.skill*0.6*sp*dt/n;
    for (const p of need){
      if (e.role==='prog') workOn(p, 'kod', amt, e.skill);
      else if (e.role==='tas') workOn(p, 'tas', amt, e.skill);
      else fixBugs(p, e.skill*0.15*testMult()*sp*dt/n);
    }
  }
}
function selProj(){
  let p = S.projs.find(x=>x.id===S.sel);
  if (!p) p = S.projs.find(needsWork) || S.projs[0] || null;
  S.sel = p ? p.id : null;
  return p;
}
function tapWork(p){
  const amt = tapPower();
  if (!devDone(p)){
    const part = lowerPart(p);
    give(p, part, amt, founderSkill());
    return '+'+r1(amt)+(part==='kod'?' 💻':' 🎨');
  }
  if (p.bugs <= 0.001) return '✔️ Hazır';
  fixBugs(p, amt*0.25);
  return '-'+r1(amt*0.25)+' 🐞';
}
function doTap(el, ev){
  const id = +el.dataset.id;
  if (id) S.sel = id;
  const p = selProj();
  if (!p){ toast('📋 Önce bir müşteri işi al ya da yeni ürün başlat!'); snd('bad'); return; }
  const r = tapWork(p);
  floatText(r, ev.clientX, ev.clientY - 18);
  snd('tap');
  if (navigator.vibrate) navigator.vibrate(6);
  updateHome(); renderPage(false);
}

/* ================= ZAMAN ================= */
function newDay(){
  S.day++;
  if (S.boost > 0) S.boost--;
  let inc = 0;
  for (const pr of S.prods) if (pr.active) inc += prodDay(pr);
  for (const b of BIZ) inc += bizIncome(b, S.biz[b.id]||0);
  S.lastDayInc = inc;
  if (inc > 0){ S.money += inc; S.stats.earned += inc; floatMoney(inc); }
  for (const p of S.projs) if (p.kind==='is' && S.day===p.deadline) toast(`⏰ ${esc(p.client)} işinin teslim günü bugün!`);
  if ((S.day-1) % MONTH_DAYS === 0) monthEnd();
  if (!S) return;
  S.nextEvent--;
  if (S.nextEvent <= 0 && !paused){ S.nextEvent = 25 + Math.floor(Math.random()*35); triggerEvent(); }
  checkGoals();
}
function prodDay(pr){
  pr.age++;
  const f = pr.age <= 8 ? pr.age/8 : Math.exp(-(pr.age-8)/pr.life);
  if (pr.viral > 0) pr.viral--;
  pr.users = Math.round(pr.peak * f * (pr.ad?1.3:1) * (pr.viral>0?2:1));
  const rev = pr.users * TYPES[pr.type].arpu * (S.upg.bulut?1.25:1) * S.ownership/100;
  pr.earned += rev;
  if (pr.age > 8 && f < 0.03){ pr.active = false; pr.users = 0; toast(`📴 ${esc(pr.name)} kapandı. Yeni ürün zamanı!`); }
  return rev;
}
function monthEnd(){
  const salaries = S.emps.reduce((a,e)=>a+e.salary,0) + OFFICES[S.office].kira;
  S.money -= salaries;
  let inst = 0;
  for (const l of S.loans){
    const pay = Math.min(l.inst, l.remaining);
    S.money -= pay; inst += pay; l.remaining -= pay; l.months--;
    if (S.money < 0) S.score = clamp(S.score-25, 300, 900); else S.score = clamp(S.score+8, 300, 900);
  }
  const closed = S.loans.filter(l=>l.remaining<=1 || l.months<=0);
  if (closed.length){ S.score = clamp(S.score+20*closed.length, 300, 900); toast('🏦 Kredin tamamen kapandı! Kredi puanın yükseldi.'); }
  S.loans = S.loans.filter(l=>!closed.includes(l));
  const total = salaries + inst;
  if (total > 0) toast(`💸 Ay sonu ödemeleri: ${tl(total)}`);
  refreshOffers(); refreshCands();
  if (S.money < -20000){ gameOver(); return; }
  if (S.money < 0) toast('⚠️ Kasa eksiye düştü! ₺-20.000 altında iflas edersin.');
}

function triggerEvent(){

function checkGoals(){
  while (S && S.goal < GOALS.length && GOALS[S.goal].c()){
    const g = GOALS[S.goal];
    S.money += g.r; S.goal++;
    toast(`🎯 Hedef tamamlandı! +${tl(g.r)}`); snd('ok');
  }
}

/* ================= EYLEMLER ================= */
function release(id){
  const p = S.projs.find(x=>x.id===id); if (!p || !devDone(p)) return;
  const q = calcQuality(p);
  const T = TYPES[p.type], sm = SIZES[p.size].m;
  S.projs = S.projs.filter(x=>x!==p);
  S.stats.best = Math.max(S.stats.best, q);
  closePage();
  if (p.kind === 'is'){
    let pay = p.pay*(0.7 + q/100*0.6);
    let rep = Math.ceil(sm*1.5*T.tier*q/60);
    const notes = [];
    if (q < p.minQ){ pay *= 0.5; rep = -2; notes.push(`😠 Müşteri kaliteyi beğenmedi (en az ${p.minQ} istiyordu). Ödemenin yarısını aldın.`); }
    if (S.day > p.deadline){ pay *= 0.6; rep -= 3; notes.push(`⏰ Teslim ${S.day-p.deadline} gün gecikti. Ödemeden %40 kesildi.`); }
    pay = Math.round(pay);
    S.money += pay; S.stats.earned += pay; S.rep = Math.max(0, S.rep+rep); S.stats.done++;
    snd(notes.length ? 'bad' : 'cash');
    showModal(`<div class="ev">📦</div><h3>İş Teslim Edildi!</h3>
      <p style="text-align:center" class="sub">${esc(p.client)}</p>
      <div class="lbl"><span>Kalite</span>${qBadge(q)}</div>
      <div class="lbl"><span>Ödeme</span><b class="green">+${tlFull(pay)}</b></div>
      <div class="lbl"><span>İtibar</span><b>${rep>=0?'+':''}${rep} ⭐</b></div>
      ${notes.map(n=>`<p class="sub">${n}</p>`).join('')}
      <button class="btn green block" data-act="close">Devam</button>`);
  } else {
    const peak = Math.round(T.users*sm*Math.pow(q/100,2)*(1+S.rep/150)*(S.upg.pazarlama?1.3:1)*(0.8+Math.random()*0.45));
    const pr = {id:S.idSeq++, name:p.name, type:p.type, size:p.size, q, peak, life:30+q*0.9, age:0, users:0, earned:0, ad:false, upd:0, viral:0, active:true, day:S.day};
    S.prods.unshift(pr);
    const rep = Math.max(-3, Math.round(q/25*Math.sqrt(sm)*T.tier) - (q<30?3:0));
    S.rep = Math.max(0, S.rep+rep); S.stats.prodsDone++;
    snd('ok');
    showModal(`<div class="ev">🚀</div><h3>${esc(p.name)} Yayında!</h3>
      <div class="lbl"><span>Kalite</span>${qBadge(q)}</div>
      <div class="lbl"><span>Beklenen zirve</span><b>~${fmt(peak)} kullanıcı</b></div>
      <div class="lbl"><span>İtibar</span><b>${rep>=0?'+':''}${rep} ⭐</b></div>
      <p class="sub">Ürünün her gün para kazandıracak. Zamanla ilgi azalır; reklam ve güncellemeyle canlı tut, yeni ürünler çıkar!</p>
      <button class="btn green block" data-act="close">Süper!</button>`);
  }
  checkGoals();
}

const trainCost = e => round10(e.skill*e.skill*250 + 500);
const adCost = p => Math.round(Math.max(800, p.peak*TYPES[p.type].arpu*4)/100)*100;
const updCost = p => Math.round(Math.max(1500, p.peak*TYPES[p.type].arpu*8*(1+p.upd*0.5))/100)*100;

const ACTIONS = {
  page: el => openPage(el.dataset.v, el.dataset.id ? +el.dataset.id : null),
  home: () => closePage(),
  close: () => { closeModal(); },
  choice: el => { const fn = curChoices[+el.dataset.i]; closeModal(); if (fn) fn(); if (S) checkGoals(); },
  begin: () => {
    const n = ($('cname').value || '').trim() || 'Garaj Yazılım';

  },
  proj: el => { S.sel = +el.dataset.id; openPage('proje', +el.dataset.id); },
  daily: () => {
    if (!dailyReady()){ toast('🎁 Bugünkü ödülünü aldın. Yarın tekrar gel!'); return; }
    const streak = S.lastDaily === todayStr(-1) ? Math.min(7, S.streak+1) : 1;

    for (let i=1;i<=7;i++) row += `<div class="${i<streak?'got':i===streak?'now':''}">${i}. gün<b>${i<streak?'✅':i===streak?'🎁':'🔒'}</b></div>`;

  },
  sound: () => { S.sound = !S.sound; snd('click'); },
  'f-type': el => { const t = el.dataset.v; if (!S.tech[t]){ toast(`🔒 ${TYPES[t].ad} teknolojisini 🧬 Teknoloji'den açmalısın.`); return; } form.type = t; form.name=''; renderPage(true); },
  'f-size': el => { const k = el.dataset.v; if (S.rep < SIZES[k].rep){ toast(`🔒 ${SIZES[k].ad} ürün için ${SIZES[k].rep} itibar gerekir.`); return; } form.size = k; renderPage(true); },
  'f-focus': el => { form.focus = el.dataset.v; renderPage(true); },
  'f-dice': () => { form.name = randProdName(form.type); const i=$('pname'); if (i) i.value = form.name; },
  'start-prod': () => {
    if (S.projs.length >= slots()){ toast('📋 Proje slotun dolu! Büyük ofise taşınarak slot aç.'); snd('bad'); return; }
    const name = (form.name||'').trim() || randProdName(form.type);
    const p = makeProj('urun', form.type, form.size, form.focus, name.slice(0,28));
    S.projs.push(p); S.sel = p.id; form.name = '';
    toast(`🛠️ ${esc(p.name)} geliştirilmeye başlandı!`); closePage(); checkGoals();
  },
  'take-offer': el => {
    if (S.projs.length >= slots()){ toast('📋 Proje slotun dolu! Önce bir projeyi bitir.'); snd('bad'); return; }
    const o = S.offers.find(x=>x.id===+el.dataset.id); if (!o) return;
    S.offers = S.offers.filter(x=>x!==o);
    const p = makeProj('is', o.type, o.size, 'dengeli', `${o.client}`, {client:o.client, pay:o.pay, minQ:o.minQ, deadline:S.day+o.days});
    S.projs.push(p); S.sel = p.id;
    toast(`🤝 ${esc(o.client)} ile anlaştın!`); closePage(); checkGoals();
  },
  'refresh-offers': () => { if (S.money < 300) return; S.money -= 300; refreshOffers(); },
  release: el => release(+el.dataset.id),
  cancel: el => {
    const p = S.projs.find(x=>x.id===+el.dataset.id); if (!p) return;
    confirmBox('🗑️','Proje iptal edilsin mi?', p.kind==='is' ? 'Müşteri işini yarıda bırakırsan <b>-3 itibar</b> kaybedersin.' : 'Bu üründe yapılan tüm çalışma çöpe gider.', 'İptal et', ()=>{
      S.projs = S.projs.filter(x=>x!==p); if (p.kind==='is') S.rep = Math.max(0, S.rep-3); closePage(); toast('🗑️ Proje iptal edildi.');
    });
  },
  hire: el => {
    const c = S.cands.find(x=>x.id===+el.dataset.id); if (!c) return;
    if (S.emps.length >= cap()){ toast('🪑 Ofiste yer yok! Ofisim\'den büyük ofise taşın.'); return; }
    const cost = round10(c.salary*0.5);
    if (S.money < cost){ toast('💸 Yeterli paran yok.'); return; }
    S.money -= cost; S.cands = S.cands.filter(x=>x!==c); S.emps.push(c);
    toast(`🤝 ${esc(c.name)} ekibe katıldı!`); snd('ok'); checkGoals();
  },
  fire: el => {
    const e = S.emps.find(x=>x.id===+el.dataset.id); if (!e) return;
    confirmBox('😬','Emin misin?', `<b>${esc(e.name)}</b> işten çıkarılacak. Tazminat olarak 1 maaş (${tl(e.salary)}) ödersin.`, 'Evet, çıkar', ()=>{
      S.money -= e.salary; S.emps = S.emps.filter(x=>x!==e); toast(`👋 ${esc(e.name)} işten çıkarıldı.`);
    });
  },
  train: el => {
    const e = S.emps.find(x=>x.id===+el.dataset.id); if (!e || e.skill>=10) return;
    const cost = trainCost(e); if (S.money < cost) return;
    S.money -= cost;
    e.salary = round10(e.salary * salaryFor(e.skill+1)/salaryFor(e.skill));
    e.skill++;
    toast(`📚 ${esc(e.name)} eğitimi bitirdi! Yetenek ${e.skill}`);
  },
  'refresh-cands': () => { if (S.money < 500) return; S.money -= 500; refreshCands(); },
  'office-up': () => {
    const n = OFFICES[S.office+1]; if (!n || S.money < n.fiyat) return;
    S.money -= n.fiyat; S.office++;
    toast(`${n.ikon} ${n.ad}'e taşındın! ${n.kap} çalışan, ${n.slot} proje slotu.`); snd('ok'); checkGoals();
  },
  tech: el => {
    const t = el.dataset.v, T = TYPES[t];
    if (S.tech[t] || S.money < T.fiyat || S.rep < T.rep) return;
    S.money -= T.fiyat; S.tech[t] = true;
    toast(`${T.ikon} ${T.ad} teknolojisi açıldı!`); snd('ok'); checkGoals();
  },
  upg: el => {
    const u = UPGRADES.find(x=>x.id===el.dataset.v); const l = S.upg[u.id]||0;
    if (l >= u.max) return; const f = u.fiyat(l); if (S.money < f) return;
    S.money -= f; S.upg[u.id] = l+1;
    toast(`${u.ikon} ${u.ad} alındı!`); snd('ok');
  },
  ad: el => {
    const p = S.prods.find(x=>x.id===+el.dataset.id); if (!p || p.ad) return;
    const c = adCost(p); if (S.money < c) return;
    S.money -= c; p.ad = true; toast(`📣 ${esc(p.name)} reklamı başladı! (+%30 kullanıcı)`);
  },
  update: el => {
    const p = S.prods.find(x=>x.id===+el.dataset.id); if (!p || p.upd>=3) return;
    const c = updCost(p); if (S.money < c) return;
    S.money -= c; p.upd++; p.age = Math.max(8, Math.round(p.age - p.life*0.6));
    toast(`🔧 ${esc(p.name)} güncellendi! Kullanıcılar geri dönüyor.`);
  },
  'bank-pct': el => { bankForm.pct = +el.dataset.v; },
  'bank-term': el => { bankForm.term = +el.dataset.v; },
  loan: () => {
    if (S.loans.length >= 3){ toast('🏦 En fazla 3 kredin olabilir.'); return; }
    const amount = Math.round(loanLimit()*bankForm.pct/1000)*1000;
    const total = Math.round(amount*(1+loanRate()*bankForm.term/12));
    const inst = Math.ceil(total/bankForm.term);
    S.loans.push({id:S.idSeq++, amount, remaining:total, inst, months:bankForm.term});
    S.money += amount;
    toast(`🏦 ${tlFull(amount)} kredi hesabına yattı.`); snd('cash');
  },
  payoff: el => {
    const l = S.loans.find(x=>x.id===+el.dataset.id); if (!l) return;
    const c = Math.round(l.remaining*0.95); if (S.money < c) return;
    S.money -= c; S.loans = S.loans.filter(x=>x!==l); S.score = clamp(S.score+25, 300, 900);
    toast('🏦 Kredi erken kapatıldı (%5 indirim). Kredi puanın arttı!'); snd('ok');
  },
  'biz-mul': el => { bizMul = el.dataset.v==='max' ? 'max' : +el.dataset.v; },
  biz: el => {
    const b = BIZ.find(x=>x.id===el.dataset.v); const l = S.biz[b.id]||0;
    if (S.rep < b.rep || l >= BIZ_MAX) return;
    const {n, cost} = l===0 ? {n:1, cost:b.fiyat} : bizBulk(b, l, bizMul);
    if (n<=0 || S.money < cost) return;
    S.money -= cost; S.biz[b.id] = l+n;
    toast(l===0 ? `${b.ikon} ${b.ad} açıldı!` : `${b.ikon} ${b.ad} → Sv. ${l+n}`); snd(l===0?'ok':'cash'); checkGoals();
  },
  reset: () => confirmBox('⚠️','Baştan başlansın mı?','Tüm ilerlemen silinecek. Bu geri alınamaz!','Evet, sıfırla', ()=>{
    localStorage.removeItem(SAVE_KEY); localStorage.removeItem(BACKUP_KEY); S = null; closePage(); showWelcome();
  }),
};

/* ---- dokunma yönetimi: kaydırırken basılmasın, yeniden çizimde tık kaybolmasın ---- */
let downX = 0, downY = 0;
document.addEventListener('pointerdown', e => {
  downX = e.clientX; downY = e.clientY;
  const t = e.target.closest('.tapper');
  if (t && S && !paused){ e.preventDefault(); doTap(t, e); }
});
document.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX-downX, e.clientY-downY) > 12) return;
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (!S && el.dataset.act !== 'begin') return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (!['choice','daily','begin'].includes(el.dataset.act)) snd('click');
  fn(el);
  updateAll(true);
});
document.addEventListener('input', e => { if (e.target.id === 'pname') form.name = e.target.value; });
document.addEventListener('contextmenu', e => e.preventDefault());

function updateHome(){
  const inc = S.lastDayInc, dbt = debt(), g = GOALS[S.goal];

      <div class="k3"><div><small>BORÇ</small><b class="red">${tl(dbt)}</b></div><div><small>GÜNLÜK GELİR</small><b class="green">+${tl(inc)}</b></div><div><small>AYLIK GİDER</small><b class="orange">-${tl(monthlyCost())}</b></div></div>
    </div>

  </div>`);
  const n = OFFICES[S.office+1];
  const dots = {
    ofis: n && S.money >= n.fiyat,
    ekip: S.emps.length < cap() && S.cands.some(c=>S.money >= round10(c.salary*0.5)) && S.emps.length===0,
    tekno: Object.entries(TYPES).some(([k,t])=>!S.tech[k] && S.rep>=t.rep && S.money>=t.fiyat),
    gelis: UPGRADES.some(u=>(S.upg[u.id]||0)<u.max && S.money>=u.fiyat(S.upg[u.id]||0)),
    yatir: BIZ.some(b=>S.rep>=b.rep && (S.biz[b.id]||0)<BIZ_MAX && S.money>=bizCost(b,S.biz[b.id]||0)),
  };
  const active = S.prods.filter(p=>p.active).length;
  const bizCount = BIZ.filter(b=>(S.biz[b.id]||0)>0).length;
  const tile = (cls, v, ti, b, sm, dot) => `<button class="tile ${cls}" data-act="page" data-v="${v}">${dot?'<span class="dot"></span>':''}<span class="ti">${ti}</span><b>${b}</b><small>${sm}</small></button>`;
  setHTML($('tiles'),
    tile('c-purple','ofis','🏢','Ofisim',OFFICES[S.office].ad,dots.ofis) +
    tile('c-teal','ekip','👥','Personel',`${S.emps.length}/${cap()} kişi`,dots.ekip) +
    tile('c-orange','urunler','📦','Ürünlerim',`${active} yayında`,false) +
    tile('c-blue','banka','🏦','Banka',S.loans.length?`${S.loans.length} aktif kredi`:'Kredi çek',false) +
    tile('c-pink','tekno','🧬','Teknoloji',`${Object.keys(S.tech).length}/4 açık`,dots.tekno) +
    tile('c-yellow','gelis','🛒','Geliştirme','Ofis ekipmanı',dots.gelis) +
    tile('c-green','yatirim','💼','Yatırımlar',`${bizCount} işletme`,dots.yatir) +
    tile('c-red','sirala','🏆','Sıralama',`${myRank()}. sıradasın`,false));
  $('offCount').textContent = `${S.offers.length} teklif bekliyor`;
  $('slotInfo').textContent = `${S.projs.length}/${slots()} slot ›`;
  const sel = selProj();
  let list = S.projs.map(p => {
    const T = TYPES[p.type], [st, cls] = projStatus(p);
    const pct = (p.kod+p.tas)/(p.kodReq+p.tasReq)*100;
    const colors = {blue:'#60a5fa', orange:'#fb923c', green:'#34d399', red:'#f87171'};
    let subTxt;
    if (p.kind==='is'){ const left = p.deadline-S.day; subTxt = `👔 ${tl(p.pay)} · ${left>=0?`⏰ ${left} gün kaldı`:`⚠️ ${-left} gün gecikti`}`; }
    else subTxt = `🛠️ ${T.ad} · %${Math.floor(pct)} · 🐞 ${Math.ceil(p.bugs)}`;
    return `<div class="prow ${sel&&sel.id===p.id?'sel':''}" data-act="proj" data-id="${p.id}" style="--c:${colors[cls]}">
      <div class="pi">${T.ikon}</div><div class="grow"><b>${esc(p.name)}</b><div class="sub">${subTxt}</div><div class="mbar"><i style="width:${pct}%"></i></div></div>
      <span class="pill ${cls}">${st}</span></div>`;
  }).join('');
  for (let i=S.projs.length; i<slots(); i++) list += `<div class="prow empty" data-act="page" data-v="isler">➕ Boş proje slotu: müşteri işi al ya da yeni ürün başlat</div>`;
  if (active) list += `<div class="prow" data-act="page" data-v="urunler" style="--c:#f5b83d"><div class="pi">📈</div><div class="grow"><b>Yayındaki ürünler: ${active}</b><div class="sub">${fmt(S.prods.reduce((a,p)=>a+p.users,0))} kullanıcı</div></div><span class="pill gold">YAYINDA</span></div>`;
  setHTML($('projList'), list);
  const b = $('tapBtn');
  let html, cls;
  if (!sel){ cls = 'tapper idle'; html = `<div>😴 Boştasın<small>Müşteri işi al ya da yeni ürün başlat</small></div><span class="arrow">→</span>`; }
  else if (!devDone(sel)){ cls = 'tapper'; html = `<div>⌨️ KOD YAZ!<small>${esc(sel.name)} · dokunuş başı +${r1(tapPower())}</small></div><span class="arrow">→</span>`; }
  else if (sel.bugs > 0.001){ cls = 'tapper bug'; html = `<div>🐞 HATA AYIKLA!<small>${esc(sel.name)} · ${Math.ceil(sel.bugs)} hata kaldı</small></div><span class="arrow">→</span>`; }
  else { cls = 'tapper'; html = `<div>✅ HAZIR!<small>${esc(sel.name)} · projeye dokun ve yayınla</small></div><span class="arrow">→</span>`; }
  if (b.className !== cls) b.className = cls;
  setHTML(b, html);
}
function projStatus(p){
  if (!devDone(p)) return (p.kind==='is' && S.day>p.deadline) ? ['GECİKTİ','red'] : ['GELİŞTİRME','blue'];
  if (p.bugs > 0.001) return ['TEST','orange'];
  return ['HAZIR ✓','green'];
}

    </div>
    ${act.length?`<div class="cards">${cards}</div>`:'<div class="empty-msg">Yayında ürünün kalmadı. Yeni bir ürün geliştirme zamanı!</div>'}
    ${old.length?`<h2>Kapanan ürünler (${old.length})</h2><div class="cards">${old.slice(0,30).map(p=>`<div class="card"><b>${TYPES[p.type].ikon} ${esc(p.name)}</b> ${qBadge(p.q)}<div class="sub">Toplam kazanç: ${tl(p.earned)}</div></div>`).join('')}</div>`:''}`;
}
function bankHTML(){
  const lim = loanLimit(), rate = loanRate();
  const amount = Math.round(lim*bankForm.pct/1000)*1000;
  const total = Math.round(amount*(1+rate*bankForm.term/12));
  const inst = Math.ceil(total/bankForm.term);
  const loans = S.loans.map(l => {
    const c = Math.round(l.remaining*0.95);
    return `<div class="card"><div class="row"><div class="big">💳</div><div class="grow"><b>${tl(l.amount)} kredi</b>
      <div class="sub">Kalan borç ${tl(l.remaining)} · ${tl(l.inst)}/ay · ${l.months} ay kaldı</div></div>
      <button class="btn sm green" data-act="payoff" data-id="${l.id}" ${S.money<c?'disabled':''}>Erken kapat ${tl(c)}</button></div></div>`;
  }).join('');
  return `<div class="cards" style="grid-template-columns:1fr 1.4fr">
    <div class="card"><div class="sub">KREDİ PUANI</div><div style="font-size:30px;font-weight:900" class="${S.score>=700?'green':S.score>=550?'gold':'red'}">${S.score}</div>
      <div class="bar" style="margin:4px 0"><i style="width:${(S.score-300)/6}%;background:linear-gradient(90deg,#f87171,#facc15,#34d399)"></i></div>
      <div class="sub">${scoreWord(S.score)} · Faiz: yıllık %${Math.round(rate*100)}</div>
      <p class="hint">Taksitleri zamanında ödersen puanın yükselir: daha yüksek limit, daha düşük faiz. Ay sonunda kasan eksiye düşerse puanın düşer!</p></div>
    <div class="card"><b>🏦 Kod Bank'tan kredi çek</b><div class="sub">Kredi limitin: <b class="gold">${tl(lim)}</b></div>
      <div class="sub" style="margin-top:6px">Tutar</div><div class="chips">${[0.25,0.5,1].map(v=>`<button class="chip ${bankForm.pct===v?'on':''}" data-act="bank-pct" data-v="${v}">${tl(Math.round(lim*v/1000)*1000)}</button>`).join('')}</div>
      <div class="sub">Vade</div><div class="chips">${[6,12,24].map(v=>`<button class="chip ${bankForm.term===v?'on':''}" data-act="bank-term" data-v="${v}">${v} ay</button>`).join('')}</div>
      <div class="grid2"><div class="kv"><b>${tl(inst)}</b><span>Aylık taksit</span></div><div class="kv"><b>${tl(total)}</b><span>Toplam geri ödeme</span></div></div>
      <button class="btn goldb block" data-act="loan" ${S.loans.length>=3?'disabled':''}>💰 ${tl(amount)} Kredi Çek</button></div>
    </div>
    <h2>Aktif kredilerin (${S.loans.length}/3)</h2>
    ${loans?`<div class="cards">${loans}</div>`:'<div class="empty-msg">Aktif kredin yok.</div>'}`;
}
function techHTML(){
  return `<p class="sub" style="margin-bottom:8px">Yeni teknolojiler daha büyük projeler, daha çok kullanıcı ve daha kârlı müşteri işleri demek.</p><div class="cards">` +
    Object.entries(TYPES).map(([k,t]) => {
      if (S.tech[k]) return `<div class="card"><div class="row"><div class="big">${t.ikon}</div><div class="grow"><b>${t.ad}</b><div class="sub">✅ Açık · ${fmt(t.users)} kullanıcı potansiyeli</div></div></div></div>`;
      const ok = S.rep >= t.rep;
      return `<div class="card"><div class="row"><div class="big">${t.ikon}</div><div class="grow"><b>${t.ad}</b>
        <div class="sub">${fmt(t.users)} kullanıcı potansiyeli · Gerekli: ${t.rep} ⭐ ${ok?'✅':'❌'}</div></div>
        <button class="btn sm goldb" data-act="tech" data-v="${k}" ${(!ok||S.money<t.fiyat)?'disabled':''}>${tl(t.fiyat)}</button></div></div>`;
    }).join('') + '</div>';
}
function upgHTML(){
  return `<div class="cards">` + UPGRADES.map(u => {
    const l = S.upg[u.id]||0, max = l>=u.max, f = u.fiyat(l);
    return `<div class="card"><div class="row"><div class="big">${u.ikon}</div><div class="grow"><b>${u.ad}</b>${u.max>1?` <span class="sub">Sv. ${l}/${u.max}</span>`:''}
      <div class="sub">${u.acik}</div></div>
      ${max?'<span class="pill green">ALINDI</span>':`<button class="btn sm" data-act="upg" data-v="${u.id}" ${S.money<f?'disabled':''}>${tl(f)}</button>`}</div></div>`;
  }).join('') + '</div>';
}
function bizHTML(){
  const mulChips = [1,10,'max'].map(v=>`<button class="chip ${bizMul===v?'on':''}" data-act="biz-mul" data-v="${v}">${v==='max'?'MAX':'x'+v}</button>`).join('');
  const total = BIZ.reduce((a,b)=>a+bizIncome(b,S.biz[b.id]||0),0);
  const cards = BIZ.map(b => {
    const l = S.biz[b.id]||0, ok = S.rep >= b.rep;
    let btn;
    if (!ok) btn = `<button class="btn sm" disabled>🔒 ${b.rep} ⭐</button>`;
    else if (l===0) btn = `<button class="btn sm goldb" data-act="biz" data-v="${b.id}" ${S.money<b.fiyat?'disabled':''}>Satın al ${tl(b.fiyat)}</button>`;
    else if (l>=BIZ_MAX) btn = '<span class="pill green">MAKS</span>';
    else { const {n,cost} = bizBulk(b,l,bizMul); btn = `<button class="btn sm green" data-act="biz" data-v="${b.id}" ${(n<=0||S.money<cost)?'disabled':''}>+${Math.max(n,1)} Sv. ${tl(n>0?cost:bizCost(b,l))}</button>`; }
    const next = [10,25,50,100].find(x=>x>l);
    return `<div class="card"><div class="row"><div class="big">${b.ikon}</div><div class="grow"><b>${b.ad}</b> ${l?`<span class="pill gold">Sv. ${l}</span>`:''}
      <div class="sub">${b.acik}</div>
      <div class="sub">${l?`Günlük gelir: <b class="green">${tl(bizIncome(b,l))}</b>`:`Açılınca günlük ~${tl(b.gelir)}`}${b.mevsim&&l?` (mevsim x${seasonMult()})`:''}${next&&l?` · Sv.${next}'da gelir x2!`:''}</div></div></div>
      <div class="row" style="margin-top:6px;justify-content:flex-end">${btn}</div></div>`;
  }).join('');
  return `<div class="row" style="margin-bottom:6px"><div class="grow"><p class="sub">Yan işler kur, şirketin büyüsün! Yatırımların her gün <b class="green">${tl(total)}</b> kazandırıyor. Sen yokken de çalışırlar.</p></div><div class="chips" style="margin:0">${mulChips}</div></div>
    <div class="cards">${cards}</div>`;
}
function rankHTML(){
  const me = valuation();
  const list = RIVALS.map(r=>({n:r.n, v:rivalVal(r), me:false})).concat([{n:S.name, v:me, me:true}]).sort((a,b)=>b.v-a.v);
  const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
  return `<p class="sub" style="margin-bottom:8px">Türkiye'nin en değerli yazılım şirketleri. Şirket değerin; kasan, gelirlerin, yatırımların, ofisin ve itibarınla hesaplanır. Zirveye çık!</p>` +
    list.map((x,i)=>`<div class="rank ${x.me?'me':''}"><div class="no">${medal(i)}</div><div class="grow"><b>${esc(x.n)}</b>${x.me?' <span class="pill gold">SEN</span>':''}</div><b class="${x.me?'gold':''}">${tl(x.v)}</b></div>`).join('');
}
function settingsHTML(){
  return `<div class="cards">
    <div class="card"><div class="row"><div class="grow"><b>🔊 Ses efektleri</b><div class="sub">Dokunma, para ve başarı sesleri</div></div><button class="toggle ${S.sound?'on':''}" data-act="sound"></button></div></div>
    <div class="card"><b>💾 Kayıt</b><div class="sub">Oyun her 5 saniyede otomatik kaydedilir, ayrıca dakikada bir yedek alınır. Sen yokken ürünlerin ve yatırımların para kazanmaya devam eder (en fazla 4 saat).</div></div>
  </div>
  <h2>İstatistikler</h2>
  <div class="grid4" style="margin-bottom:8px">
    <div class="kv"><b>${S.day}</b><span>Gün</span></div>
    <div class="kv"><b>${tl(S.stats.earned)}</b><span>Toplam kazanç</span></div>
    <div class="kv"><b>${S.stats.done} / ${S.stats.prodsDone}</b><span>Müşteri işi / Ürün</span></div>
    <div class="kv"><b>${S.stats.best}</b><span>En iyi kalite</span></div>
  </div>
  <button class="btn red" data-act="reset">🗑️ Baştan Başla</button>`;
}

/* ---- bildirimler / modal ---- */
function toast(html){
  const t = document.createElement('div'); t.className='toast'; t.innerHTML = html;
  const box = $('toasts'); box.appendChild(t);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(()=>t.remove(), 2900);
}
function floatText(txt, x, y, cls){
  const f = document.createElement('div'); f.className = 'float '+(cls||''); f.textContent = txt;
  f.style.left = x+'px'; f.style.top = y+'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(), 950);
}
function floatMoney(v){
  if (document.hidden || page) return;
  const r = $('hMoney').getBoundingClientRect();
  floatText('+'+tl(v), r.left + r.width/2, r.bottom + 4);
}
function showModal(html){ const m = $('modal'); m.innerHTML = `<div class="mbox">${html}</div>`; m.classList.remove('hidden'); paused = true; }
function closeModal(){ const m = $('modal'); m.classList.add('hidden'); m.innerHTML=''; paused = false; }
function showWelcome(){
  showModal(`<div class="ev">💻</div><h3>Kod Patronu</h3>
    <p style="text-align:center">Garajında tek bir bilgisayarla başlıyorsun. Müşteri işleri al, kendi ürünlerini çıkar, ekip kur, yatırım yap ve şirketini bir <b>teknoloji devine</b> dönüştür!</p>
    <div class="row" style="margin-top:8px"><input type="text" id="cname" maxlength="24" placeholder="Şirketinin adı: Garaj Yazılım"><button class="btn goldb" data-act="begin" style="white-space:nowrap">🚀 Başla</button></div>`);
}

/* ================= KAYIT ================= */
let lastBackup = 0;
function save(){
  if (!S) return;
  S.lastSeen = Date.now();
  try {
    const d = JSON.stringify(S);
    localStorage.setItem(SAVE_KEY, d);
    if (Date.now() - lastBackup > 60000){ localStorage.setItem(BACKUP_KEY, d); lastBackup = Date.now(); }
  } catch(e){}
}
function migrate(d){
  const s = Object.assign(newState(d.name), d);
  s.stats = Object.assign(newState('').stats, d.stats||{});
  if (s.v === 1){ s.projs = d.proj ? [d.proj] : []; delete s.proj; s.v = 2; }
  if (!Array.isArray(s.projs)) s.projs = [];
  return s;
}
function load(){
  for (const key of [SAVE_KEY, BACKUP_KEY]){
    try {
      const d = JSON.parse(localStorage.getItem(key));
      if (d && (d.v===1 || d.v===2) && d.name){ S = migrate(d); return true; }
    } catch(e){}
  }
  return false;
}
function awayGain(sec){
  const s = Math.min(sec, 4*3600);
  const gain = Math.round((S.lastDayInc||0) * (s/DAY_SEC) * 0.3);
  if (gain > 0 && sec > 20){
    S.money += gain; S.stats.earned += gain;
    const mins = Math.round(s/60);
    showModal(`<div class="ev">🌙</div><h3>Tekrar hoş geldin!</h3>
      <p style="text-align:center">Sen yokken (${mins>=60?Math.floor(mins/60)+' saat ':''}${mins%60} dk) ürünlerin ve yatırımların çalışmaya devam etti.</p>
      <p style="text-align:center;font-size:24px;font-weight:900;margin:8px 0" class="green">+${tlFull(gain)}</p>
      <button class="btn goldb block" data-act="close">Harika!</button>`);
    snd('cash');
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

/* ================= DÖNGÜ ================= */
let last = performance.now(), acc = 0;
function loop(){
  const now = performance.now();
  const dt = (now - last)/1000; last = now;
  if (!S || paused) return;
  if (dt > 5){ awayGain(dt); updateAll(true); return; }
  workTick(dt);
  S.dayFrac += dt/DAY_SEC;
  while (S && S.dayFrac >= 1){ S.dayFrac -= 1; newDay(); if (paused) break; }
  if (!S) return;
  acc += dt;
  if (acc >= 0.25){ acc = 0; updateAll(false); }
}
setInterval(loop, 100);
setInterval(save, 5000);

if (load()){
  updateAll(true);
  awayGain((Date.now() - S.lastSeen)/1000);
} else showWelcome();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
